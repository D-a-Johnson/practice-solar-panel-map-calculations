[project]
name = "solar-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "djangorestframework>=3.18.3",
    "gunicorn>=26.2.0",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.1",
]

[tool.pytest]
DJANGO_SETTINGS_MODULE = "config.settings"
# collectstatic only runs in the Docker image, so the static folder is
# missing here and WhiteNoise warns about it whenever DEBUG is off.
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "DJ"]

[tool.uv]
exclude-newer = "1 day"
